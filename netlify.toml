[build]
  # Comando para construir Quartz y actualizar submodules
  command = """
    git submodule sync --recursive
    git submodule update --init --recursive
    git submodule update --remote --merge
    npx quartz build
  """
  # Carpeta que Netlify publicará
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

[context.production.environment]
  # Asegura que Netlify clone los submodules
  GIT_SUBMODULE_STRATEGY = "recursive"
